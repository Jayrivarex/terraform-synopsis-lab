name: CI & DevSecOps Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-analysis:
    name: SAST and Code Quality Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ['javascript', 'python'] # Ajusta según el lenguaje de la app

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3